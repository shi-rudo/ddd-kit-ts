packages:
  - packages/*

allowBuilds:
  # Testcontainers reaches Docker over its socket. It needs neither the SSH
  # transport nor the native bindings and generated code of these three packages.
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true

overrides:
  qs: 6.16.0
  # Vite+ publishes its core under the conventional Vite package name and
  # bundles the matching Vitest release. Keep every transitive peer on that
  # single toolchain instance, as required by the Vite+ pnpm migration.
  vite: "catalog:"
  vitest: "catalog:"

catalog:
  "@vitest/coverage-v8": 4.1.10
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# The @shirudo packages skip the release-age check of pnpm, so the kit can
# adopt a release of its own peer packages on the day it is published. The
# lockfile still pins each version and its integrity hash.
minimumReleaseAgeExclude:
  - "@shirudo/*"
