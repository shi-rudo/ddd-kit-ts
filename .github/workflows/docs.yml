name: Deploy Docs

# The documentation site is offline. German law requires a legal notice
# (TMG §5) and a privacy notice (GDPR Art. 13) for a publicly reachable
# site. Neither page exists yet. The docs source stays in the repository
# and runs locally with `pnpm docs:dev`.
#
# One guard holds the site offline. This workflow starts only by hand,
# and the build job runs only if the operator confirms the legal pages.
# The job trusts that confirmation. It does not look for the files.
#
# GitHub Pages is configured for this repository, with GitHub Actions as
# the source. No run has filled it, so the URL answers 404 today. One
# successful run of this workflow makes the site public.
#
# To publish:
#  1. Add docs/legal/legal-notice.md and docs/legal/privacy.md. Link them
#     from .vitepress/config.ts (themeConfig.footer and sidebar).
#  2. Start this workflow by hand and confirm the legal pages.
#  3. To publish every push to main, uncomment the `push:` trigger below.

on:
  # push:
  #   branches: [main]

  # Manual start only. The build job needs an explicit acknowledgement
  # that the legal pages exist.
  workflow_dispatch:
    inputs:
      legal_pages_in_place:
        description: "Confirm that legal-notice.md and privacy.md are published in the docs."
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Force GitHub-Actions's JS runtime (the host running each action's
  # script) onto Node 24 ahead of the June 2026 forced-default. Separate
  # from the in-job Node version below.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    if: ${{ inputs.legal_pages_in_place == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          # Node 24 is current LTS as of May 2026. The library itself
          # has no Node-version dependency (es2022 target, Web Crypto),
          # so we just run the toolchain on the latest LTS.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
