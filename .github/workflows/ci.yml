name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package smoke (pack + import from the tarball)
        run: |
          base_error_version=$(node -p "require('./node_modules/@shirudo/base-error/package.json').version")
          result_version=$(node -p "require('./node_modules/@shirudo/result/package.json').version")
          rm -rf /tmp/pack-smoke /tmp/pack-consumer
          mkdir -p /tmp/pack-smoke /tmp/pack-consumer
          pnpm pack --pack-destination /tmp/pack-smoke
          tarball=$(printf '%s\n' /tmp/pack-smoke/shirudo-ddd-kit-*.tgz)
          cd /tmp/pack-consumer
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$tarball" "@shirudo/base-error@$base_error_version" "@shirudo/result@$result_version" typescript@5.9.3
          cp -f "$GITHUB_WORKSPACE/scripts/package-smoke/consumer.mts" .
          npx tsc consumer.mts --strict --skipLibCheck false --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir dist
          node dist/consumer.mjs

  docs:
    # Building the docs is not publishing them. The site stays offline
    # (see docs.yml), and this job only resolves what nothing else checks:
    # the VitePress snippet includes, the typedoc output, and every
    # internal link. Two moves during the src reorganization broke a link
    # and two includes while typecheck, tests, lint, build and the edge
    # smoke all stayed green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Docs resolve their includes, links and API output
        run: pnpm docs:build

  edge-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Built package in edge runtimes
        run: pnpm test:edge-runtime

  ci-passed:
    # The only required check of main. It needs every other job, so a new
    # job joins the merge gate in this file.
    # test/architecture/ci-required-checks.test.ts fails while a job is
    # missing from needs. always() keeps this job from being skipped after a
    # failed job, because GitHub counts a skipped required check as passed.
    if: always()
    needs: [verify, docs, edge-runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A needed job ended with the result '$result'."
              exit 1
            fi
          done
