name: npm-publish

# Publishes the package when a version tag is pushed (the local flow is
# `npm version <x.y.z[-rc.n]>` followed by `git push --follow-tags`).
# `workflow_dispatch` covers a tag that was pushed before this workflow
# existed or a re-run after a fixed registry problem: run it from the
# Actions tab (or `gh workflow run`) on a ref whose package.json version
# carries an existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # npm Trusted Publishing: the job authenticates to the registry through
  # this workflow's OIDC identity. No token secret exists or is needed,
  # and the publish carries provenance for this exact run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version must carry its tag
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$pkg" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg." >&2
              echo "Cut releases with 'npm version' so the two cannot drift." >&2
              exit 1
            fi
          else
            git fetch --tags --quiet
            if ! git rev-parse -q --verify "refs/tags/v$pkg" >/dev/null; then
              echo "No tag v$pkg exists for package.json version $pkg." >&2
              echo "Tag the release before dispatching a publish." >&2
              exit 1
            fi
          fi

      # `npm publish` runs prepublishOnly first: clean, typecheck, lint,
      # test, build, and the edge-runtime smoke. A prerelease version
      # publishes under the `next` dist-tag (the release-candidate soak);
      # a stable version publishes under `latest`.
      - name: Publish
        run: |
          pkg=$(node -p "require('./package.json').version")
          case "$pkg" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing $pkg with dist-tag $dist_tag"
          npm publish --provenance --access public --tag "$dist_tag"
